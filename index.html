<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Limit — Gym Tracker</title>
<meta name="theme-color" content="#0A0B0A">
<meta name="description" content="Your personal 5-day muscle-building tracker.">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Limit">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="app-header">
    <div class="row">
      <div class="brand">
        <img class="brand-logo" src="/brand/logo-mark.png" alt="NO LIMIT Gym">
      </div>
      <div class="hdr-right">
        <div class="hdate" id="hdate"></div>
        <button class="hdr-gear" data-act="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="hdr-av" id="hdr-av" data-act="profile" aria-label="Your profile">?</button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
    <button data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11"/><path d="M4 8l-1.5 1.5M20 16l1.5-1.5"/><path d="M8 4L6.5 5.5M18 20l-1.5-1.5"/><rect x="4" y="8" width="4" height="8" rx="1"/><rect x="16" y="8" width="4" height="8" rx="1"/></svg>Train</button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>Progress</button>
    <button data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Log</button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h6"/></svg>Plan</button>
    <button data-tab="squad">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="9" r="2.2"/><path d="M16 14.5c2.6.2 4.5 2 4.5 4.5"/></svg>Squad</button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
